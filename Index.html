<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PJOK Sehat – Belajar Jasmani</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mu:#5b6b85;--br:#e2e8f2;--pr:#2563eb;--pr2:#7c3aed;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#172036;--tx:#e8eefc;--mu:#9fb0cf;--br:#27334f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#172036;--tx:#e8eefc;--mu:#9fb0cf;--br:#27334f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
header b{font-size:19px}header span{opacity:.85;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--br);position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:4}
nav button{flex:none;border:0;background:transparent;color:var(--mu);padding:8px 14px;border-radius:99px;font:600 14px inherit;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:20px;padding:26px 20px;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0 0 14px;opacity:.92}
.btn{border:0;background:var(--pr);color:#fff;padding:10px 18px;border-radius:12px;font:600 15px inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.w{background:#fff;color:var(--pr)}.btn.g{background:var(--br);color:var(--tx)}.btn.r{background:var(--no)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{text-align:center}.stat b{font-size:26px;display:block;color:var(--pr)}.stat small{color:var(--mu)}
.topic{cursor:pointer;transition:transform .15s;border-top:5px solid var(--c)}.topic:hover{transform:translateY(-3px)}
.topic .em{font-size:40px}.mu{color:var(--mu);font-size:14px}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.pic{border-radius:14px;color:#fff;padding:14px 8px;text-align:center;background:linear-gradient(145deg,var(--c),#0f172a)}
.pic .em{font-size:48px;display:block}.pic small{display:block;margin-top:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-weight:600;font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:2px solid var(--br);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pr)}.opt.ok{border-color:var(--ok);background:#16a34a22}.opt.no{border-color:var(--no);background:#dc262622}
.bar{height:10px;border-radius:9px;background:var(--br);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .3s}
.ring{width:130px;height:130px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font-size:34px;font-weight:800;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--br) 0)}
.ring span{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--br);text-align:left;white-space:nowrap}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--br);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q{padding:10px 0;border-bottom:1px solid var(--br)}
a{color:var(--pr)}
</style></head><body>
<header><div style="font-size:28px">🏃</div><div><b>PJOK Sehat</b><br><span>Belajar Pendidikan Jasmani, Olahraga &amp; Kesehatan</span></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TOP=[
{n:'Sepak Bola',e:'⚽',c:'#16a34a',d:'Permainan bola besar beregu yang dimainkan dua tim, masing-masing 11 pemain, dengan tujuan memasukkan bola ke gawang lawan.',p:['Pemanasan 10 menit sebelum bermain','Passing: gunakan kaki bagian dalam untuk umpan pendek','Trapping: sambut bola dengan lembut agar terkontrol','Dribbling: sentuh bola dengan punggung kaki sambil menjaga jarak'],ic:[['👟','Passing'],['🥅','Shooting'],['🧤','Penjaga gawang']],v:['teknik dasar sepak bola passing dribbling','latihan sepak bola untuk pelajar']},
{n:'Bola Voli',e:'🏐',c:'#f59e0b',d:'Permainan bola besar dengan net, tiap tim 6 pemain, bola dipukul melewati net dan tidak boleh jatuh di lapangan sendiri.',p:['Servis bawah cocok untuk pemula','Passing bawah memakai kedua lengan bawah rapat','Passing atas memakai ujung jari','Smash: awalan, lompat, pukul keras ke lapangan lawan'],ic:[['🙌','Passing atas'],['💥','Smash'],['🏆','Set']],v:['teknik dasar bola voli servis passing smash','cara passing bawah bola voli']},
{n:'Bola Basket',e:'🏀',c:'#ea580c',d:'Permainan beregu, 5 pemain per tim, memasukkan bola ke keranjang lawan setinggi 3,05 meter.',p:['Dribbling dengan ujung jari, bukan telapak','Chest pass: umpan dari dada dengan dua tangan','Lay-up: melangkah dua kali lalu melempar ke ring','Hindari travelling dan double dribble'],ic:[['⛹️','Dribbling'],['🎯','Shooting'],['🛡️','Defense']],v:['teknik dasar bola basket dribbling passing','cara lay up basket untuk pemula']},
{n:'Atletik',e:'🏅',c:'#dc2626',d:'Cabang olahraga induk: lari, lompat, dan lempar. Melatih kecepatan, kekuatan, dan daya tahan.',p:['Lari jarak pendek memakai start jongkok','Lompat jauh: awalan, tumpuan, melayang, mendarat','Tolak peluru dilakukan dengan menolak, bukan melempar','Estafet: oper tongkat di zona pergantian'],ic:[['🏃','Lari'],['🦘','Lompat'],['🥏','Lempar']],v:['teknik lari jarak pendek start jongkok','teknik lompat jauh gaya jongkok']},
{n:'Senam Lantai',e:'🤸',c:'#9333ea',d:'Rangkaian gerak di atas matras untuk melatih kelentukan, kekuatan, keseimbangan, dan koordinasi.',p:['Selalu lakukan pemanasan sendi','Guling depan: dagu menempel dada, punggung membulat','Kayang: dorong pinggul ke atas, tangan lurus','Gunakan matras dan didampingi guru'],ic:[['🤸','Guling'],['🧘','Sikap lilin'],['🌈','Meroda']],v:['senam lantai guling depan guling belakang','cara kayang dan meroda untuk pemula']},
{n:'Kebugaran & Kesehatan',e:'💪',c:'#0891b2',d:'Kebugaran jasmani, gizi seimbang, istirahat cukup, dan pertolongan pertama cedera olahraga.',p:['Olahraga 3–5 kali seminggu','Minum air putih sebelum, saat, dan sesudah latihan','Tidur 8–10 jam bagi remaja','Cedera terkilir: RICE (Rest, Ice, Compression, Elevation)'],ic:[['💧','Hidrasi'],['🥗','Gizi'],['😴','Istirahat']],v:['kebugaran jasmani remaja olahraga sehat','pertolongan pertama cedera olahraga RICE']}];
const F=[
[['Jumlah pemain inti satu tim sepak bola?','11','9','10','12'],['Lama waktu normal pertandingan sepak bola?','2 x 45 menit','2 x 30 menit','2 x 40 menit','4 x 15 menit'],['Pelanggaran bek di dalam kotak penalti dihukum dengan?','Tendangan penalti','Lemparan ke dalam','Tendangan gawang','Bola dijatuhkan'],['Siapa yang boleh memegang bola dengan tangan di area penalti?','Penjaga gawang','Bek','Gelandang','Penyerang'],['Menghentikan dan mengontrol bola disebut?','Trapping','Heading','Shooting','Throw-in'],['Memainkan bola dengan kepala disebut?','Heading','Dribbling','Passing','Trapping'],['Kartu yang berarti pemain dikeluarkan dari lapangan?','Kartu merah','Kartu kuning','Kartu hijau','Kartu biru'],['Bagian kaki untuk umpan pendek yang akurat?','Kaki bagian dalam','Ujung kaki','Tumit','Lutut']],
[['Jumlah pemain bola voli di lapangan per tim?','6','5','7','9'],['Poin untuk memenangi set normal bola voli?','25','21','15','30'],['Maksimal sentuhan bola per tim sebelum melewati net?','3','2','4','5'],['Pukulan pembuka permainan bola voli disebut?','Servis','Smash','Block','Set'],['Pukulan keras ke lapangan lawan disebut?','Smash','Passing bawah','Block','Servis'],['Passing bawah memakai bagian tangan?','Lengan bawah','Ujung jari','Siku','Punggung tangan'],['Tinggi net bola voli putra?','2,43 m','2,24 m','2,00 m','2,60 m'],['Pemain bertahan khusus dengan seragam berbeda?','Libero','Setter','Spiker','Kapten']],
[['Jumlah pemain basket di lapangan per tim?','5','6','7','11'],['Tembakan dari luar garis tiga angka bernilai?','3 poin','2 poin','1 poin','4 poin'],['Lemparan bebas yang masuk bernilai?','1 poin','2 poin','3 poin','4 poin'],['Menggiring bola dalam basket disebut?','Dribbling','Passing','Rebound','Block'],['Tinggi ring basket dari lantai?','3,05 m','2,43 m','2,80 m','3,50 m'],['Berjalan membawa bola tanpa memantulkannya disebut?','Travelling','Dunk','Block','Rebound'],['Tembakan dekat ring sambil melangkah disebut?','Lay-up','Screen','Pivot','Jump ball'],['Lama satu kuarter menurut aturan FIBA?','10 menit','12 menit','8 menit','15 menit']],
[['Nomor lari jarak pendek?','100 meter','1.500 meter','5.000 meter','Maraton'],['Panjang satu putaran lintasan standar?','400 meter','200 meter','500 meter','100 meter'],['Panjang lari maraton?','42,195 km','21 km','10 km','50 km'],['Start yang dipakai pelari jarak pendek?','Start jongkok','Start berdiri','Start melayang','Start duduk'],['Bagian tempat bertumpu pada lompat jauh?','Papan tumpu','Bak pasir','Mistar','Matras'],['Tolak peluru dilakukan dengan cara?','Ditolak','Dilempar','Ditendang','Dipukul'],['Alat yang dioper pada lari estafet?','Tongkat estafet','Bola','Cakram','Lembing'],['Lembing termasuk nomor?','Lempar','Lompat','Lari','Jalan cepat']],
[['Gerakan berguling ke depan di matras disebut?','Guling depan','Kayang','Meroda','Handstand'],['Tubuh melengkung ke belakang bertumpu tangan dan kaki?','Kayang','Guling','Sikap lilin','Split'],['Tubuh lurus bertumpu bahu dengan kaki ke atas?','Sikap lilin','Kayang','Meroda','Berdiri'],['Gerakan seperti roda berputar ke samping?','Meroda','Guling depan','Sikap lilin','Kayang'],['Alat utama senam lantai?','Matras','Raket','Net','Shuttlecock'],['Tujuan utama pemanasan?','Mencegah cedera','Menambah lelah','Membuat mengantuk','Menurunkan nafsu makan'],['Kelentukan adalah kemampuan?','Sendi bergerak luas','Berlari cepat','Mengangkat beban','Menahan napas'],['Senam irama dilakukan dengan?','Iringan musik','Tanpa gerakan','Memakai raket','Dalam air']],
[['Gaya renang tercepat?','Gaya bebas','Gaya dada','Gaya punggung','Gaya kupu-kupu'],['Frekuensi olahraga yang dianjurkan?','3–5 kali seminggu','1 kali sebulan','1 kali setahun','Setiap jam'],['Minuman terbaik saat berolahraga?','Air putih','Minuman bersoda','Kopi manis','Teh kemasan manis'],['Kegiatan setelah latihan inti untuk memulihkan tubuh?','Pendinginan','Pemanasan','Tidur larut','Makan manis banyak'],['Kemampuan jantung dan paru bekerja lama disebut?','Daya tahan kardiorespirasi','Kelentukan','Keseimbangan','Kecepatan'],['Lama tidur ideal remaja per hari?','8–10 jam','2 jam','4 jam','14 jam'],['Sumber energi utama tubuh?','Karbohidrat','Vitamin','Air','Mineral'],['RICE pada cedera terkilir singkatan dari?','Rest, Ice, Compression, Elevation','Run, Ice, Cold, Exercise','Rest, Iron, Care, Energy','Rub, Ice, Cover, Eat']]];
function gen(){const b=[];let id=1;F.forEach((fs,t)=>fs.forEach(([q,a,x,y,z])=>{b.push({id:id++,t,k:'m',q,o:[a,x,y,z],a:0});b.push({id:id++,t,k:'tf',q:'Benar atau salah? '+q+' Jawabannya: '+a+'.',o:['Benar','Salah'],a:0});b.push({id:id++,t,k:'tf',q:'Benar atau salah? '+q+' Jawabannya: '+x+'.',o:['Benar','Salah'],a:1})}));return b}
let bank=ls.g('pj_bank',null)||gen(),results=ls.g('pj_hist',[]),board=[],db=null,user=null,view='home',sel=-1,teacher=false,tTab='bank',Q=null,loc=null,ed=null,filt={t:'all',s:''};
const saveBank=()=>{ls.s('pj_bank',bank);if(db)db.doc('cfg/bank').set({json:JSON.stringify(bank)}).catch(()=>{})};
(async()=>{try{if(window.claude){db=await claude.use('db');user=await claude.use('user')}}catch(e){}
if(db){try{const s=await db.doc('cfg/bank').get();if(s.exists)bank=JSON.parse(s.data().json)}catch(e){}
try{db.collection('results').orderBy('ts','desc').limit(300).onSnapshot(sn=>{results=sn.docs.map(d=>d.data());paint()},()=>{})}catch(e){}
try{db.collection('board').orderBy('score','desc').limit(30).onSnapshot(sn=>{board=sn.docs.map(d=>d.data());paint()},()=>{})}catch(e){}}
paint()})();
const NAV=[['home','🏠 Beranda'],['materi','📚 Materi'],['kuis','📝 Kuis'],['rank','🏆 Peringkat'],['guru','👩‍🏫 Guru']];
function go(v,s){view=v;if(s!==undefined)sel=s;scrollTo(0,0);paint()}
function paint(){if(Q&&view==='kuis'&&Q.on)return;$('#nav').innerHTML=NAV.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}',-1)">${l}</button>`).join('');
const f={home,materi,kuis,rank,guru}[view];$('#app').innerHTML=f()}
function home(){const bk=[...new Set(bank.map(q=>q.t))].length;return`<div class="hero"><h1>Ayo Bergerak, Ayo Belajar! 🏃‍♂️</h1><p>Materi lengkap, gambar &amp; video pembelajaran, ratusan soal latihan, dan penilaian otomatis. Bisa dibuka di HP maupun komputer.</p><button class="btn w" onclick="go('materi',-1)">Mulai Belajar</button> <button class="btn w" style="background:#ffffff33;color:#fff" onclick="go('kuis')">Ikut Kuis</button></div>
<div class="stats"><div class="card stat"><b>${TOP.length}</b><small>Bab materi</small></div><div class="card stat"><b>${bank.length}</b><small>Bank soal</small></div><div class="card stat"><b>${results.length}</b><small>Kuis selesai</small></div></div>
<div class="grid">${[['📚','Materi bergambar','Penjelasan, poin penting, dan ilustrasi tiap cabang olahraga.'],['🎬','Video pembelajaran','Tautan video demonstrasi gerakan untuk setiap bab.'],['📝','Kuis &amp; nilai otomatis','Skor, pembahasan, dan predikat langsung muncul.'],['📍','Lokasi pengisi','Lokasi (GPS) tercatat saat siswa mengerjakan kuis.'],['👩‍🏫','Panel guru','Tambah, ubah, hapus soal dan lihat rekap nilai.'],['🏆','Papan peringkat','Siswa terbaik tampil di peringkat bersama.']].map(x=>`<div class="card"><div style="font-size:30px">${x[0]}</div><b>${x[1]}</b><div class="mu">${x[2]}</div></div>`).join('')}</div>`}
function materi(){if(sel<0)return`<h2>Pilih Materi</h2><div class="grid">${TOP.map((t,i)=>`<div class="card topic" style="--c:${t.c}" onclick="go('materi',${i})"><div class="em">${t.e}</div><b>${t.n}</b><div class="mu">${t.d.slice(0,80)}…</div></div>`).join('')}</div>`;
const t=TOP[sel];return`<button class="btn g" onclick="go('materi',-1)">← Kembali</button><div class="card" style="--c:${t.c};margin-top:12px"><h2 style="margin-top:0">${t.e} ${t.n}</h2><p>${t.d}</p>
<div class="pics">${t.ic.map(i=>`<div class="pic"><span class="em">${i[0]}</span><small>${i[1]}</small></div>`).join('')}</div>
<h3>Poin Penting</h3><ol>${t.p.map(p=>`<li>${p}</li>`).join('')}</ol>
<h3>🎬 Video Pembelajaran</h3><div class="row">${t.v.map(q=>`<a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}">▶ ${esc(q)}</a>`).join('')}</div>
<p class="mu">Video dibuka di tab baru (YouTube).</p><button class="btn" style="background:${t.c}" onclick="startSetup(${sel})">Latihan soal ${t.n}</button></div>`}
let setupT='all';function startSetup(t){setupT=t;go('kuis')}
function kuis(){if(Q&&Q.on)return quiz();if(Q&&Q.done)return result();
return`<h2>Mulai Kuis</h2><div class="card"><label>Nama lengkap</label><input id="nm" value="${esc(ls.g('pj_nm',''))}" placeholder="Nama siswa"><label>Kelas</label><input id="kl" value="${esc(ls.g('pj_kl',''))}" placeholder="mis. VIII-A">
<label>Materi</label><select id="tp"><option value="all">Campuran semua bab</option>${TOP.map((t,i)=>`<option value="${i}" ${String(setupT)===String(i)?'selected':''}>${t.e} ${t.n}</option>`).join('')}</select>
<label>Jumlah soal</label><select id="jm"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
<p class="mu">📍 Saat mulai, browser akan meminta izin lokasi. Lokasi dicatat untuk guru bersama nilai Anda.</p><button class="btn" onclick="begin()">Mulai</button></div>`}
function begin(){const n=$('#nm').value.trim();if(!n){alert('Isi nama dulu ya');return}ls.s('pj_nm',n);ls.s('pj_kl',$('#kl').value);const t=$('#tp').value,pool=bank.filter(q=>t==='all'||q.t==+t);if(!pool.length){alert('Belum ada soal');return}
const go2=()=>{const qs=sh(pool).slice(0,+$('#jm').value).map(q=>{if(q.k==='tf')return{...q};const idx=sh(q.o.map((_,i)=>i));return{...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}});Q={on:1,name:n,kelas:$('#kl').value,t,qs,i:0,sc:0,ans:[],fb:null};paint2()};
if(navigator.geolocation){$('#app').innerHTML='<div class="card">📍 Mengambil lokasi…</div>';navigator.geolocation.getCurrentPosition(p=>{loc={lat:+p.coords.latitude.toFixed(5),lon:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy)};go2()},()=>{loc=null;go2()},{timeout:8000})}else{loc=null;go2()}}
function paint2(){$('#nav').innerHTML=NAV.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}',-1)">${l}</button>`).join('');$('#app').innerHTML=Q.on?quiz():result()}
function quiz(){const q=Q.qs[Q.i],fb=Q.fb;return`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">${TOP[q.t]?TOP[q.t].n:'Umum'}</span><span class="mu">Soal ${Q.i+1}/${Q.qs.length} · ${loc?'📍 lokasi aktif':'📍 lokasi tidak aktif'}</span></div><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><h3>${esc(q.q)}</h3>
${q.o.map((o,i)=>`<button class="opt ${fb!==null?(i===q.a?'ok':i===fb?'no':''):''}" ${fb!==null?'disabled':''} onclick="pick(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}
${fb!==null?`<p><b>${fb===q.a?'✅ Benar!':'❌ Kurang tepat.'}</b> Jawaban: ${esc(q.o[q.a])}</p><button class="btn" onclick="nextQ()">${Q.i+1<Q.qs.length?'Lanjut →':'Lihat Nilai'}</button>`:''}</div>`}
function pick(i){const q=Q.qs[Q.i];Q.fb=i;Q.ans.push(i);if(i===q.a)Q.sc++;paint2()}
function nextQ(){Q.fb=null;if(Q.i+1<Q.qs.length){Q.i++;paint2();return}Q.on=0;Q.done=1;finish();paint2()}
function pred(s){return s>=90?['Sangat Baik 🌟','A']:s>=75?['Baik 👍','B']:s>=60?['Cukup 🙂','C']:['Perlu Belajar Lagi 💪','D']}
function finish(){const s=Math.round(Q.sc/Q.qs.length*100),r={name:Q.name,kelas:Q.kelas,topic:Q.t==='all'?'Campuran':TOP[+Q.t].n,score:s,benar:Q.sc,total:Q.qs.length,ts:Date.now(),lat:loc?loc.lat:null,lon:loc?loc.lon:null,acc:loc?loc.acc:null};Q.r=r;
const h=ls.g('pj_hist',[]);h.unshift(r);ls.s('pj_hist',h.slice(0,100));if(!db)results=h;
if(db){db.collection('results').add(r).catch(()=>{});db.collection('board').add({name:r.name,topic:r.topic,score:s,ts:r.ts}).catch(()=>{})}else board=[...board,{name:r.name,topic:r.topic,score:s,ts:r.ts}].sort((a,b)=>b.score-a.score)}
function result(){const r=Q.r,p=pred(r.score);return`<div class="card" style="text-align:center"><h2>Hasil: ${esc(r.name)}</h2><div class="ring" style="--p:${r.score}"><span>${r.score}</span></div><b>${p[0]} (Predikat ${p[1]})</b><p>Benar ${r.benar} dari ${r.total} soal${r.lat?`<br>📍 <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lat},${r.lon}">Lokasi saat mengerjakan</a> (${r.lat}, ${r.lon})`:''}</p><button class="btn" onclick="Q=null;go('kuis')">Ulangi</button> <button class="btn g" onclick="go('rank')">Lihat Peringkat</button></div>
<div class="card"><h3>Pembahasan</h3>${Q.qs.map((q,i)=>`<div class="q">${Q.ans[i]===q.a?'✅':'❌'} ${esc(q.q)}<br><span class="mu">Jawaban benar: ${esc(q.o[q.a])}</span></div>`).join('')}</div>`}
function rank(){const b=board.length?board:[...results].sort((a,b)=>b.score-a.score).slice(0,30);return`<h2>🏆 Peringkat</h2><div class="card tbl"><table><tr><th>#</th><th>Nama</th><th>Materi</th><th>Nilai</th></tr>${b.map((r,i)=>`<tr><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${esc(r.name)}</td><td>${esc(r.topic)}</td><td><b>${r.score}</b></td></tr>`).join('')||'<tr><td colspan=4>Belum ada hasil.</td></tr>'}</table></div>`}
async function guru(){return ''}
guru=function(){if(!teacher)return`<div class="card"><h2>Panel Guru</h2><p class="mu">Masuk sebagai guru untuk mengelola soal dan melihat rekap nilai.</p><input id="pin" type="password" placeholder="PIN guru"><button class="btn" onclick="login()">Masuk</button> <span class="mu">(PIN awal: guru123, atau otomatis bagi pemilik halaman)</span></div>`;
return`<div class="row" style="margin-bottom:10px"><button class="btn ${tTab==='bank'?'':'g'}" onclick="tTab='bank';paint()">📋 Bank Soal (${bank.length})</button><button class="btn ${tTab==='rekap'?'':'g'}" onclick="tTab='rekap';paint()">📊 Rekap Nilai (${results.length})</button></div>${tTab==='bank'?bankUI():rekap()}`};
async function login(){let ok=false;try{ok=user&&await user.canEdit()}catch(e){}if(ok||$('#pin').value==='guru123'){teacher=true;paint()}else alert('PIN salah')}
(async()=>{try{await new Promise(r=>setTimeout(r,1500));if(user&&await user.canEdit()){teacher=true;paint()}}catch(e){}})();
function bankUI(){const L=bank.filter(q=>(filt.t==='all'||q.t==+filt.t)&&q.q.toLowerCase().includes(filt.s.toLowerCase()));const e=ed||{t:0,k:'m',q:'',o:['','','',''],a:0};
return`<div class="card"><h3>${ed&&ed.id?'Edit soal #'+ed.id:'Tambah soal baru'}</h3><label>Bab</label><select id="et">${TOP.map((t,i)=>`<option value="${i}" ${e.t===i?'selected':''}>${t.n}</option>`).join('')}</select>
<label>Pertanyaan</label><textarea id="eq" rows="2">${esc(e.q)}</textarea><label>Pilihan jawaban (pilih yang benar)</label>${[0,1,2,3].map(i=>`<div class="row" style="flex-wrap:nowrap"><input type="radio" name="ea" value="${i}" style="width:auto" ${e.a===i?'checked':''}><input id="eo${i}" value="${esc(e.o[i]||'')}" placeholder="Pilihan ${String.fromCharCode(65+i)}${i>1?' (boleh kosong untuk Benar/Salah)':''}"></div>`).join('')}
<button class="btn" onclick="saveQ()">Simpan</button> ${ed?'<button class="btn g" onclick="ed=null;paint()">Batal</button>':''}</div>
<div class="card"><div class="row"><select id="ft" style="flex:1" onchange="filt.t=this.value;paint()"><option value="all">Semua bab</option>${TOP.map((t,i)=>`<option value="${i}" ${String(filt.t)===String(i)?'selected':''}>${t.n}</option>`).join('')}</select><input id="fs" style="flex:2" placeholder="Cari soal…" value="${esc(filt.s)}" onchange="filt.s=this.value;paint()"></div><p class="mu">Menampilkan ${Math.min(L.length,40)} dari ${L.length} soal.</p>
${L.slice(0,40).map(q=>`<div class="q"><span class="tag">${TOP[q.t]?TOP[q.t].n:'-'}</span> ${esc(q.q)}<br><span class="mu">✔ ${esc(q.o[q.a])}</span><div class="row"><button class="btn g" onclick="editQ(${q.id})">Edit</button><button class="btn r" onclick="delQ(${q.id})">Hapus</button></div></div>`).join('')}
<button class="btn g" style="margin-top:10px" onclick="if(confirm('Kembalikan bank soal ke bawaan?')){bank=gen();saveBank();paint()}">Reset ke bawaan</button></div>`}
function editQ(id){ed=bank.find(q=>q.id===id);scrollTo(0,0);paint()}
function delQ(id){if(confirm('Hapus soal ini?')){bank=bank.filter(q=>q.id!==id);saveBank();paint()}}
function saveQ(){const q=$('#eq').value.trim();let o=[0,1,2,3].map(i=>$('#eo'+i).value.trim()),a=+(document.querySelector('input[name=ea]:checked')||{value:0}).value;if(!q||!o[0]||!o[1]){alert('Isi pertanyaan dan minimal 2 pilihan');return}if(!o[a]){alert('Jawaban benar tidak boleh kosong');return}
const keep=o.map((x,i)=>[x,i]).filter(x=>x[0]);const na=keep.findIndex(x=>x[1]===a);o=keep.map(x=>x[0]);const n={t:+$('#et').value,k:o.length===2?'tf':'m',q,o,a:na};
if(ed&&ed.id){Object.assign(ed,n)}else{n.id=Math.max(0,...bank.map(x=>x.id))+1;bank.push(n)}ed=null;saveBank();paint()}
function rekap(){return`<div class="card tbl"><p class="mu">Lokasi diambil dari GPS perangkat siswa saat mulai kuis (koordinat + tautan peta).</p><table><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Materi</th><th>Nilai</th><th>Lokasi</th></tr>${results.map(r=>`<tr><td>${new Date(r.ts).toLocaleString('id-ID')}</td><td>${esc(r.name)}</td><td>${esc(r.kelas)}</td><td>${esc(r.topic)}</td><td><b>${r.score}</b></td><td>${r.lat?`<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lat},${r.lon}">📍 ${r.lat}, ${r.lon}</a>`:'–'}</td></tr>`).join('')||'<tr><td colspan=6>Belum ada data.</td></tr>'}</table></div>`}
paint();
</script></body></html>
